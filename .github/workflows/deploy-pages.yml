name: Deploy to GitHub Pages

# Deploys the repository root as a static site. There is no build step: the game
# is plain ES modules with vendored Three.js and vendored CC0 audio, so what is
# in the repository is exactly what ships.
#
# This workflow runs on push to any branch it is enabled for, plus manual
# dispatch, so a feature branch can be previewed before it is merged.

on:
  push:
    branches:
      - main
      - 'arena/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push supersedes an older run.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    name: Automated tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Track geometry gate
        run: npm run validate
      - name: Unit, integration and DOM tests
        run: npm test

  deploy:
    name: Deploy
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Publish exactly the site and nothing else. scripts/publish-list.mjs is
      # the single source of truth for what ships, and tests/publish.test.mjs
      # asserts that the staged tree still contains every file the running game
      # asks for - so this list cannot quietly rot into a deploy that 404s on one
      # asset. Development material (tests/, scripts/, package-lock.json, the
      # prose docs) and every dotfile are excluded by construction rather than
      # relying on the upload action's own exclusion rules.
      - name: Stage the site
        run: node scripts/publish-list.mjs --stage _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
